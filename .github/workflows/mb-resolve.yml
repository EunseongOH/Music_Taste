name: MusicBrainz Canonical Resolver

# 개발 중에는 수동 실행만 한다.
#
# GitHub Actions 의 schedule: 트리거는 기본 브랜치의 워크플로 파일만 실행하므로
# feat/canonical-db 에 cron 을 적어도 어차피 돌지 않는다. 혼동을 피하려고 아예 뺀다.
# develop 병합이 승인되면 그때 아래 cron 을 넣는다:
#   schedule:
#     - cron: '*/30 * * * *'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'resolve'
        type: choice
        options: [resolve, seed]
      batch:
        description: '한 번에 처리할 큐 건수 (resolve 전용)'
        required: false
        default: '200'

jobs:
  resolve:
    runs-on: ubuntu-latest
    # MB 는 1 req/s 라 배치가 길다. 기본 6 시간 한도 안에서 넉넉히.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Seed resolve queue
        if: ${{ inputs.mode == 'seed' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/mb_resolve.ts --seed

      - name: Resolve queue
        if: ${{ inputs.mode == 'resolve' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MB_BATCH: ${{ inputs.batch }}
        run: npx tsx scripts/mb_resolve.ts
