name: Spotify Artist Cache Refresh

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 3시 (UTC 18시)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '갱신할 아티스트 수 (비우면 40)'
        required: false
        default: '40'

# 아티스트 캐시(이름·사진)를 ID 로 갱신한다.
#
# 예전에는 scripts/warmup_artists.ts 로 하드코딩된 이름 목록을 /v1/search 로 찾았다.
# 두 가지가 잘못돼 있었다.
#   - 이미 DB 에 있는 아티스트를 이름으로 다시 찾느라 검색 쿼터를 태운다.
#   - `npm run db:warmup` 이 --env-file=.env.local 을 쓰는데 CI 에는 그 파일이 없다.
#     Node 는 없는 env 파일을 만나면 죽는다. 그래서 이 작업은 실제로 한 번도 돌지 않았다
#     (2026-09-21 확인: 최근 14일간 새벽 3시에 캐시된 행 0건).
# 이제 ID 로 /v1/artists/{id} 를 부르고, 비밀값은 아래 env 로 받는다.
jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh artist cache by ID
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        # TTL 90일 · 2,829팀이면 하루 32명이면 충분하다. 여유를 둬서 40.
        # 예약 실행에는 inputs 가 없어 40 이 된다. 수동 실행에서만 수를 바꾼다.
        run: npm run db:refresh-artists -- ${{ inputs.count || 40 }}
